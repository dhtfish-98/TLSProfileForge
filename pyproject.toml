[build-system]
requires = ["setuptools==82.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tls-profile-forge"
version = "0.1.4"
description = "Offline fixed-guideline TLS configuration drafts and capability evidence"
readme = "项目文档/README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["项目文档/LICENSE", "项目文档/NOTICE", "项目文档/licenses/TLSRef-data-MPL-2.0.txt", "项目文档/licenses/checkers/redis-7.4.1-LICENSE.txt"]
authors = [{name = "dhtfish98"}]
maintainers = [{name = "dhtfish98"}]
dependencies = []

[project.scripts]
tls-profile-forge = "tls_profile_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tls_profile_forge = ["py.typed", "data/*.json"]
