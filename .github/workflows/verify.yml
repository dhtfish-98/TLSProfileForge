name: offline-package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    defaults:
      run:
        working-directory: ${{ github.workspace }}/Build/源码
    env:
      TMPDIR: ${{ github.workspace }}/Build/临时
      TMP: ${{ github.workspace }}/Build/临时
      TEMP: ${{ github.workspace }}/Build/临时
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/Build/缓存/python
      PIP_CACHE_DIR: ${{ github.workspace }}/Build/缓存/pip
      npm_config_cache: ${{ github.workspace }}/Build/缓存/npm
      RUFF_CACHE_DIR: ${{ github.workspace }}/Build/缓存/ruff
      GOCACHE: ${{ github.workspace }}/Build/缓存/go
      GOMODCACHE: ${{ github.workspace }}/Build/缓存/go-mod
      GOTMPDIR: ${{ github.workspace }}/Build/临时
      GOPATH: ${{ github.workspace }}/Build/缓存/go-path
      GOBIN: ${{ github.workspace }}/Build/输出/go-bin
      CARGO_HOME: ${{ github.workspace }}/Build/缓存/cargo
      XDG_CACHE_HOME: ${{ github.workspace }}/Build/缓存/xdg
      CCACHE_DIR: ${{ github.workspace }}/Build/缓存/ccache
      SCCACHE_DIR: ${{ github.workspace }}/Build/缓存/sccache
      NODE_COMPILE_CACHE: ${{ github.workspace }}/Build/缓存/node
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Stage source and restored project inputs under Build
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} 构建.py --stage --ci
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m build
      - run: 'python -m venv "$TMPDIR/tls-consumer"'
      - run: '"$TMPDIR/tls-consumer/bin/pip" install --no-index --no-deps dist/*.whl'
      - run: 'cd "$TMPDIR" && "$TMPDIR/tls-consumer/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/Build/源码/tests" -v'
  official-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ${{ github.workspace }}/Build/源码
    env:
      TMPDIR: ${{ github.workspace }}/Build/临时
      TMP: ${{ github.workspace }}/Build/临时
      TEMP: ${{ github.workspace }}/Build/临时
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/Build/缓存/python
      PIP_CACHE_DIR: ${{ github.workspace }}/Build/缓存/pip
      npm_config_cache: ${{ github.workspace }}/Build/缓存/npm
      RUFF_CACHE_DIR: ${{ github.workspace }}/Build/缓存/ruff
      GOCACHE: ${{ github.workspace }}/Build/缓存/go
      GOMODCACHE: ${{ github.workspace }}/Build/缓存/go-mod
      GOTMPDIR: ${{ github.workspace }}/Build/临时
      GOPATH: ${{ github.workspace }}/Build/缓存/go-path
      GOBIN: ${{ github.workspace }}/Build/输出/go-bin
      CARGO_HOME: ${{ github.workspace }}/Build/缓存/cargo
      XDG_CACHE_HOME: ${{ github.workspace }}/Build/缓存/xdg
      CCACHE_DIR: ${{ github.workspace }}/Build/缓存/ccache
      SCCACHE_DIR: ${{ github.workspace }}/Build/缓存/sccache
      NODE_COMPILE_CACHE: ${{ github.workspace }}/Build/缓存/node
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Stage source and restored project inputs under Build
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} 构建.py --stage --ci
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Install compiler and development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libpcre2-dev libexpat1-dev bison flex pkg-config
      - name: Build fixed official checkers into a local prefix
        run: python scripts/build_syntax_checkers.py --root validation-local/ci --openssl-prefix /usr --pcre-config /usr/bin/pcre2-config
      - name: Check both profiles and reject negative controls
        run: PYTHONPATH=src python scripts/check_official_syntax.py --build validation-local/ci --openssl /usr/bin/openssl
